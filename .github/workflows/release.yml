name: Release

# 发版规则：脚本里的 VERSION 字段是唯一版本来源。
# 只要 main 分支上的 VERSION 变成一个新值，本工作流就自动打 tag 并发布 Release。
# 其他分支不会执行发版（见下面的 if 与 branches 限制）。
#
# 发布说明由 scripts/gen-release-notes.sh 自动生成：
#   定位句 + 提交列表 + 安装那段 + sha256（v4.0.0 起不再有破坏性变更登记表）
# 同一个内容也用作 annotated tag 的消息，所以 `git show vX.Y.Z` 能看到改了什么。

on:
  push:
    branches: [main]
    paths:
      - container-autoupdate.sh
      - scripts/gen-release-notes.sh
      - scripts/ct-stale-lock-check.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 打 tag 并发布 Release
    # 显式指定 24.04，不用 ubuntu-latest：后者会在 2026-10 迁移到 Ubuntu 26，
    # 届时镜像与预装工具都会变，发版这种低频任务没必要跟着漂。
    runs-on: ubuntu-24.04
    # 只有 main 分支允许发版；workflow_dispatch 选到别的分支时直接跳过
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码（含全部 tag）
        # v6 起运行时是 node24；v4 是 node20，已被 GitHub 标为弃用
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 校验脚本
        run: |
          set -eu
          test -f container-autoupdate.sh || { echo "::error::找不到 container-autoupdate.sh"; exit 1; }
          test -f scripts/ct-stale-lock-check.sh || { echo "::error::找不到 scripts/ct-stale-lock-check.sh"; exit 1; }
          # 3.0.0 起不再发布引导器；它若被加回来，Release 会多出一个不该有的资产
          test ! -e ct-bootstrap.sh || { echo "::error::ct-bootstrap.sh 不该再存在（3.0.0 起安装方式已改为计划任务里直接下载主脚本）"; exit 1; }

          for f in container-autoupdate.sh scripts/gen-release-notes.sh scripts/ct-stale-lock-check.sh; do
            if ! sh -n "$f"; then
              echo "::error::$f 语法检查失败（sh -n）"
              exit 1
            fi
            # 行尾必须是 LF：CRLF 会让 sh 把 \r 当成参数的一部分
            if grep -qU $'\r' "$f"; then
              echo "::error::$f 含 CRLF 行尾，请转换为 LF"
              exit 1
            fi
            # git 里记录的是 100755（可执行）还是 100644（不可执行）。
            # 记录成 100644 时，用户下载后必须自己 chmod +x，否则直接执行会 Permission denied。
            MODE=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$MODE" != "100755" ]; then
              echo "::error::$f 在 git 中的模式是 $MODE，应为 100755（可执行）"
              echo "::error::修复：git update-index --chmod=+x $f"
              exit 1
            fi
          done
          echo "语法 / 行尾 / 可执行权限检查全部通过"

      - name: 读取 VERSION 字段
        id: ver
        run: |
          set -eu
          # 只取行首的 VERSION=，不会误抓 API_VERSION
          V=$(grep -m1 '^VERSION=' container-autoupdate.sh | cut -d'"' -f2)
          if [ -z "$V" ]; then
            echo "::error::脚本里找不到 VERSION 字段"
            exit 1
          fi
          case "$V" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION 格式不合法：$V（应形如 1.2.3）"; exit 1 ;;
          esac
          case "$V" in
            *[!0-9.]*) echo "::error::VERSION 只能包含数字和点：$V"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "读取到 VERSION=$V"

      - name: 判断是否需要发版
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          TAG="v$VERSION"
          # 不能只看 tag：上一轮可能「tag 打出去了、Release 没发出去」
          # （实测发生过：gh release create 偶发失败，而 tag 已经推上去了）。
          # 只判 tag 存在就 skip，会让这个版本永远发不出去——所以两个都要看。
          _tag=0
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && _tag=1
          _rel=0
          gh release view "$TAG" >/dev/null 2>&1 && _rel=1
          if [ "$_tag" = "1" ] && [ "$_rel" = "1" ]; then
            echo "tag 与 Release 都已存在，无需发版（VERSION 未变更）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$_tag release=$_rel，继续发版"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 找上一个发布 tag
        id: prev
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          TAG="v$VERSION"
          # 取「比当前版本小的最大者」，不用 tag 创建时间（避免手动补 tag 或乱序推送时取错）。
          # 不用 `sort -V`：它是 GNU 扩展，busybox/Alpine 上不存在，换 runner 就会静默取错。
          # 这里用 awk 把版本拆成三段数字比较，纯 POSIX。
          PREV=""
          for t in $(git tag -l 'v*'); do
            [ "$t" = "$TAG" ] && continue
            tv="${t#v}"
            [ "$tv" = "$VERSION" ] && continue
            # tv < VERSION 且 tv > PREV 时更新 PREV
            _r=$(awk -v a="$tv" -v b="$VERSION" -v c="${PREV#v}" '
              function k(s,   n,i,arr,v) {
                n = split(s, arr, ".")
                v = 0
                for (i = 1; i <= 3; i++) v = v * 1000 + (arr[i] == "" ? 0 : arr[i] + 0)
                return v
              }
              BEGIN {
                ka = k(a); kb = k(b)
                if (ka >= kb) { print "no"; exit }
                if (c == "") { print "yes"; exit }
                kc = k(c)
                print (ka > kc ? "yes" : "no")
              }')
            [ "$_r" = "yes" ] && PREV="$t"
          done
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "上一个发布 tag: ${PREV:-（无，这是首个发布）}"

      - name: 生成发布说明
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PREV_TAG: ${{ steps.prev.outputs.prev_tag }}
        run: |
          set -eu
          sh scripts/gen-release-notes.sh > release-notes.md
          echo "----- 生成的发布说明 -----"
          cat release-notes.md

      - name: 打 tag
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # 上一轮已经把它打出去了（只有 Release 那步失败）——不能重复创建。
            echo "tag $TAG 已存在，跳过创建"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tag 消息复用发布说明，这样 `git show vX.Y.Z` 也能看到这版改了什么
          git tag -a "$TAG" -F release-notes.md
          git push origin "refs/tags/$TAG"
          echo "已创建并推送 tag $TAG（含发布说明）"

      - name: 发布 Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          TAG="v$VERSION"
          # 主脚本与排查脚本作为 Release 资产上传，这样
          # releases/latest/download/{container-autoupdate.sh,ct-stale-lock-check.sh} 永远指向最新发布版。
          # 3.0.0 起不再有 ct-bootstrap.sh：安装方式改为计划任务里直接下载主脚本。
          # 失败时重试：gh release create 会偶发失败（实测 v4.0.2 这一轮就挂了），
          # 而 tag 已经推出去，不重试就得手工补发 Release。
          _i=1
          while :; do
            if gh release create "$TAG" \
                 --title "$TAG" \
                 --notes-file release-notes.md \
                 container-autoupdate.sh \
                 scripts/ct-stale-lock-check.sh; then
              echo "已发布 Release $TAG"
              exit 0
            fi
            if [ "$_i" -ge 4 ]; then
              echo "::error::gh release create 连续 4 次失败，请手工补发 Release $TAG"
              exit 1
            fi
            echo "第 $_i 次 gh release create 失败，30 秒后重试"
            _i=$(( _i + 1 ))
            sleep 30
            # 重试前再确认一次：也许上一次其实成功了（只是返回码不对）
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG 其实已经存在，收工"
              exit 0
            fi
          done
