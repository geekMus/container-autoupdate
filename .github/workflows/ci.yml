name: CI

# 非 main 分支与 PR 只做校验，不发版。

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 校验脚本
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        # v6 起运行时是 node24；v4 是 node20，已被 GitHub 标为弃用
        uses: actions/checkout@v6

      - name: 引导器确实已经删掉
        run: |
          set -eu
          # 3.0.0 起不再发布 ct-bootstrap.sh。它若被谁加回来，
          # Release 会多出一个「用户任务里早就不该有」的资产，文档也会自相矛盾。
          if [ -e ct-bootstrap.sh ]; then
            echo "::error::ct-bootstrap.sh 不该再存在（3.0.0 起安装方式改为计划任务里直接下载主脚本）"
            exit 1
          fi
          echo "ct-bootstrap.sh 不存在，符合预期"

      - name: 语法检查
        run: |
          set -eu
          for f in container-autoupdate.sh scripts/gen-release-notes.sh scripts/ct-stale-lock-check.sh; do
            if ! sh -n "$f"; then
              echo "::error::$f 语法检查失败（sh -n）"
              exit 1
            fi
          done
          echo "sh -n 通过"

      - name: 行尾检查
        run: |
          set -eu
          for f in container-autoupdate.sh scripts/gen-release-notes.sh scripts/ct-stale-lock-check.sh; do
            if grep -qU $'\r' "$f"; then
              echo "::error::$f 含 CRLF 行尾，请转换为 LF"
              exit 1
            fi
          done
          echo "LF 检查通过"

      - name: VERSION 字段检查
        run: |
          set -eu
          V=$(grep -m1 '^VERSION=' container-autoupdate.sh | cut -d'"' -f2)
          if [ -z "$V" ]; then
            echo "::error::脚本里找不到 VERSION 字段"
            exit 1
          fi
          echo "VERSION=$V"

      - name: 可执行权限检查
        run: |
          set -eu
          # git 里应记录为 100755；记录成 100644 时用户下载后必须自己 chmod +x
          for f in container-autoupdate.sh scripts/gen-release-notes.sh scripts/ct-stale-lock-check.sh; do
            MODE=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$MODE" != "100755" ]; then
              echo "::error::$f 在 git 中的模式是 $MODE，应为 100755（可执行）"
              echo "::error::修复：git update-index --chmod=+x $f"
              exit 1
            fi
          done
          echo "可执行权限检查通过"

      - name: 帮助信息可用
        run: |
          set -eu
          sh container-autoupdate.sh --help >/dev/null
          sh container-autoupdate.sh --version

      - name: 不认识的东西一律报错退出
        run: |
          set -eu
          # 4.0.0 起没有兼容层：不认识的参数就是错，退出码 1。
          # 这条守卫防止有人又把「静默忽略」加回来。
          rc=0
          sh container-autoupdate.sh --compat 4.0.0 --compose a >/dev/null 2>&1 || rc=$?
          if [ "$rc" != "1" ]; then
            echo "::error::--compat 应以退出码 1 中止，实际是 $rc"
            exit 1
          fi
          rc=0
          sh container-autoupdate.sh --state-dir /tmp/x --compose a >/dev/null 2>&1 || rc=$?
          if [ "$rc" != "1" ]; then
            echo "::error::--state-dir 应以退出码 1 中止，实际是 $rc"
            exit 1
          fi
          echo "未知参数检查通过"

      - name: 文档检查
        run: |
          set -eu
          # 文档只维护中文版：本地链接与锚点、表格结构、CRLF。
          if [ -f scripts/check-docs.py ]; then
            python3 scripts/check-docs.py .
          fi

      - name: shellcheck（仅提示，不阻断）
        continue-on-error: true
        run: |
          shellcheck -S warning container-autoupdate.sh || true
